# Notify when an InPost parcel goes out for delivery.

alias: "InPost: out for delivery"
description: Notify when a parcel is loaded for delivery or heading to your locker.
mode: queued
max: 10

triggers:
  - trigger: event
    event_type: inpost_parcel_status_changed

conditions:
  - condition: template
    value_template: "{{ trigger.event.data.new_status == 'out_for_delivery' }}"

actions:
  - action: notify.mobile_app
    data:
      title: "InPost on the way"
      message: >-
        {{ trigger.event.data.sender or trigger.event.data.barcode }}
        is on its way.
      data:
        clickAction: "{{ trigger.event.data.url }}"
