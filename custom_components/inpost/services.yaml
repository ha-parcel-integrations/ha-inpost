track_parcel:
  fields:
    tracking_code:
      required: true
      example: "639900000000000000000"
      selector:
        text:
    country:
      default: PL
      selector:
        select:
          options:
            - "PL"
            - "IT"
            - "PT"
            - "GB"
            - "ES"
    contents:
      required: false
      example: "Running shoes"
      selector:
        text:

untrack_parcel:
  fields:
    tracking_code:
      required: true
      example: "639900000000000000000"
      selector:
        text:
    country:
      default: PL
      selector:
        select:
          options:
            - "PL"
            - "IT"
            - "PT"
            - "GB"
            - "ES"

update_contents:
  fields:
    tracking_code:
      required: true
      example: "639900000000000000000"
      selector:
        text:
    contents:
      required: false
      example: "Running shoes"
      selector:
        text:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: inpost
